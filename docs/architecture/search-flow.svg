<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 636" width="760" height="636" role="img" aria-label="검색 요청의 흐름. SearchView 에서 시작해 SearchFeature, SearchResultFeature, SearchRepository, RemoteSearchRepository, SearchAPIClient 를 거쳐 GitHub API 로 가고, 응답은 SearchDTO 에서 RepositorySearchPage 로, HTTPError 에서 SearchError 로 바뀌어 화면 상태로 돌아온다.">
<title>검색 한 번이 지나가는 길</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif}
.t-title{font-size:15px;font-weight:600}.t-sub{font-size:11.5px}.t-name{font-size:12.5px;font-weight:600}
.t-mono,.t-arrow-mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10.5px}
.t-note{font-size:10.5px}.t-arrow{font-size:11.5px}
.edge{stroke-width:1.4;fill:none}.inner{stroke-width:1}
.app,.feat,.dom,.data,.util{stroke-width:1.4}.ext{stroke-width:1.2;stroke-dasharray:5 4}.bg{stroke-width:1}
.bg{fill:#ffffff;stroke:#d3d9e1}
text{fill:#16202b} .t-sub,.t-note{fill:#5b6878}
.edge{stroke:#16202b} .head{fill:#16202b}
.inner{fill:#ffffff;stroke:#d3d9e1}
.ext{fill:#ffffff;stroke:#5b6878}
.app{fill:#eceff3;stroke:#6a7686}
.feat{fill:#e6effc;stroke:#2f6fd0}
.dom{fill:#fbeedd;stroke:#b0621a}
.data{fill:#e0f3ec;stroke:#1f8a6d}
.util{fill:#eeeaf7;stroke:#7a6aa8}
@media (prefers-color-scheme: dark){
.bg{fill:#1a2029;stroke:#343d4a}
text{fill:#e6ebf2} .t-sub,.t-note{fill:#98a4b3}
.edge{stroke:#e6ebf2} .head{fill:#e6ebf2}
.inner{fill:#1a2029;stroke:#343d4a}
.ext{fill:#1a2029;stroke:#98a4b3}
.app{fill:#232a34;stroke:#a3adba}
.feat{fill:#1b2a40;stroke:#7fb0f5}
.dom{fill:#3a2a18;stroke:#e9a560}
.data{fill:#173229;stroke:#5fcfae}
.util{fill:#2a2540;stroke:#b3a5dc}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="635" rx="10"/>
<defs>
  <marker id="ah2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path class="head" d="M0,0 L9,4.5 L0,9 z"/>
  </marker>
</defs>

<!-- 노드 -->
<rect class="feat" x="260" y="20" width="240" height="44" rx="7"/>
<text class="t-name" x="380" y="47" text-anchor="middle">SearchView</text>

<rect class="feat" x="260" y="108" width="240" height="44" rx="7"/>
<text class="t-name" x="380" y="135" text-anchor="middle">SearchFeature</text>

<rect class="feat" x="260" y="196" width="240" height="44" rx="7"/>
<text class="t-name" x="380" y="223" text-anchor="middle">SearchResultFeature</text>

<rect class="dom" x="260" y="284" width="240" height="44" rx="7"/>
<text class="t-name" x="380" y="311" text-anchor="middle">SearchRepository</text>

<rect class="data" x="260" y="372" width="240" height="44" rx="7"/>
<text class="t-name" x="380" y="399" text-anchor="middle">RemoteSearchRepository</text>

<rect class="data" x="260" y="460" width="240" height="44" rx="7"/>
<text class="t-name" x="380" y="487" text-anchor="middle">SearchAPIClient</text>

<rect class="ext" x="260" y="548" width="240" height="44" rx="7"/>
<text class="t-name" x="380" y="575" text-anchor="middle">api.github.com</text>

<!-- 요청 (아래로, 왼쪽) -->
<line class="edge" x1="330" y1="64" x2="330" y2="104" marker-end="url(#ah2)"/>
<text class="t-arrow-mono" x="316" y="88" text-anchor="end">searchSubmitted</text>

<line class="edge" x1="330" y1="152" x2="330" y2="192" marker-end="url(#ah2)"/>
<text class="t-arrow-mono" x="316" y="176" text-anchor="end">.result(.searchRequested)</text>

<line class="edge" x1="330" y1="240" x2="330" y2="280" marker-end="url(#ah2)"/>
<text class="t-arrow-mono" x="316" y="264" text-anchor="end">search(keyword, page)</text>

<line class="edge" x1="330" y1="328" x2="330" y2="368" marker-end="url(#ah2)"/>
<text class="t-arrow" x="316" y="352" text-anchor="end">liveValue 로 연결된 구현</text>

<line class="edge" x1="330" y1="416" x2="330" y2="456" marker-end="url(#ah2)"/>
<text class="t-arrow-mono" x="316" y="440" text-anchor="end">searchRepositories(keyword:page:)</text>

<line class="edge" x1="330" y1="504" x2="330" y2="544" marker-end="url(#ah2)"/>
<text class="t-arrow-mono" x="316" y="528" text-anchor="end">GET /search/repositories?q=&amp;page=</text>

<!-- 응답 (위로, 오른쪽) -->
<line class="edge" x1="430" y1="548" x2="430" y2="508" marker-end="url(#ah2)"/>
<text class="t-arrow" x="444" y="532">JSON, 상태 코드</text>

<line class="edge" x1="430" y1="460" x2="430" y2="420" marker-end="url(#ah2)"/>
<text class="t-arrow-mono" x="444" y="444">SearchDTO | HTTPError</text>

<line class="edge" x1="430" y1="372" x2="430" y2="332" marker-end="url(#ah2)"/>
<text class="t-arrow-mono" x="444" y="356">RepositorySearchPage | SearchError</text>

<line class="edge" x1="430" y1="284" x2="430" y2="244" marker-end="url(#ah2)"/>
<text class="t-arrow-mono" x="444" y="268">searchResponse(Result)</text>

<line class="edge" x1="430" y1="196" x2="430" y2="156" marker-end="url(#ah2)"/>
<text class="t-arrow" x="444" y="180">phase, repositories, totalCount</text>

<line class="edge" x1="430" y1="108" x2="430" y2="68" marker-end="url(#ah2)"/>
<text class="t-arrow" x="444" y="92">상태를 관찰해 화면 갱신</text>

<text class="t-note" x="316" y="622" text-anchor="end">요청 ↓</text>
<text class="t-note" x="444" y="622">응답 ↑</text>
</svg>
