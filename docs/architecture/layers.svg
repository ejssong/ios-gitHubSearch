<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 590" width="1020" height="590" role="img" aria-label="계층 의존 방향. Feature 와 Data 가 모두 Domain 을 향하고, Application 이 Feature 를 합성하고 Data 의 구현을 Domain 인터페이스에 연결한다. Util 은 Feature 와 Domain 이 함께 쓴다.">
<title>계층과 의존 방향</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif}
.t-title{font-size:15px;font-weight:600}.t-sub{font-size:11.5px}.t-name{font-size:12.5px;font-weight:600}
.t-mono,.t-arrow-mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10.5px}
.t-note{font-size:10.5px}.t-arrow{font-size:11.5px}
.edge{stroke-width:1.4;fill:none}.inner{stroke-width:1}
.app,.feat,.dom,.data,.util{stroke-width:1.4}.ext{stroke-width:1.2;stroke-dasharray:5 4}.bg{stroke-width:1}
.bg{fill:#ffffff;stroke:#d3d9e1}
text{fill:#16202b} .t-sub,.t-note{fill:#5b6878}
.edge{stroke:#16202b} .head{fill:#16202b}
.inner{fill:#ffffff;stroke:#d3d9e1}
.ext{fill:#ffffff;stroke:#5b6878}
.app{fill:#eceff3;stroke:#6a7686}
.feat{fill:#e6effc;stroke:#2f6fd0}
.dom{fill:#fbeedd;stroke:#b0621a}
.data{fill:#e0f3ec;stroke:#1f8a6d}
.util{fill:#eeeaf7;stroke:#7a6aa8}
@media (prefers-color-scheme: dark){
.bg{fill:#1a2029;stroke:#343d4a}
text{fill:#e6ebf2} .t-sub,.t-note{fill:#98a4b3}
.edge{stroke:#e6ebf2} .head{fill:#e6ebf2}
.inner{fill:#1a2029;stroke:#343d4a}
.ext{fill:#1a2029;stroke:#98a4b3}
.app{fill:#232a34;stroke:#a3adba}
.feat{fill:#1b2a40;stroke:#7fb0f5}
.dom{fill:#3a2a18;stroke:#e9a560}
.data{fill:#173229;stroke:#5fcfae}
.util{fill:#2a2540;stroke:#b3a5dc}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="1019" height="589" rx="10"/>
<defs>
  <marker id="ah1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path class="head" d="M0,0 L9,4.5 L0,9 z"/>
  </marker>
</defs>

<!-- Application -->
<rect class="app" x="30" y="20" width="960" height="76" rx="8"/>
<text class="t-title" x="50" y="48">Application</text>
<text class="t-sub" x="146" y="48">진입점, 계층을 조립하는 곳</text>
<text class="t-mono" x="50" y="76">GitHubSearchApp · AppFeature · AppView · Dependencies.swift</text>

<line class="edge" x1="160" y1="96" x2="160" y2="166" marker-end="url(#ah1)"/>
<text class="t-arrow" x="172" y="136">Scope 로 합성</text>
<line class="edge" x1="510" y1="96" x2="510" y2="166" marker-end="url(#ah1)"/>
<text class="t-arrow" x="522" y="136">liveValue 연결</text>
<line class="edge" x1="860" y1="96" x2="860" y2="166" marker-end="url(#ah1)"/>
<text class="t-arrow" x="872" y="136">make() 호출</text>

