<text class="t-name" x="754" y="355">Image</text>
<text class="t-mono" x="754" y="372">KingfisherImagePrefetchRepository</text>

<rect class="inner" x="742" y="390" width="236" height="46" rx="6"/>
<text class="t-name" x="754" y="409">UserDefaults</text>
