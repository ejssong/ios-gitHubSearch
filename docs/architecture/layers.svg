<rect class="inner" x="50" y="216" width="220" height="54" rx="6"/>
<text class="t-name" x="62" y="238">Search</text>
<text class="t-mono" x="62" y="256">SearchFeature + View</text>
<line class="edge" x1="80" y1="270" x2="80" y2="296" marker-end="url(#ah1)"/>
<text class="t-arrow-mono" x="92" y="288">ifLet(result)</text>

<rect class="inner" x="50" y="300" width="220" height="54" rx="6"/>
<text class="t-name" x="62" y="322">SearchResult</text>
<text class="t-mono" x="62" y="340">SearchResultFeature + View</text>
<line class="edge" x1="80" y1="354" x2="80" y2="380" marker-end="url(#ah1)"/>
