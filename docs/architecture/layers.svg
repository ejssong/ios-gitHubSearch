<!-- Util -->
<line class="edge" x1="160" y1="460" x2="160" y2="506" marker-end="url(#ah1)"/>
<text class="t-arrow" x="172" y="488">포맷, 문자열 다듬기</text>
<line class="edge" x1="510" y1="460" x2="510" y2="506" marker-end="url(#ah1)"/>
<text class="t-arrow" x="522" y="488">포맷 사용</text>

<rect class="util" x="30" y="510" width="960" height="62" rx="8"/>
<text class="t-title" x="50" y="536">Util</text>
<text class="t-sub" x="88" y="536">계층과 무관한 공통 도구. 다른 폴더를 참조하지 않는다</text>
<text class="t-mono" x="50" y="558">Formatters.swift — Date.monthDayText (MM.dd) · Int.groupedText (266,714) · String.trimmed</text>
